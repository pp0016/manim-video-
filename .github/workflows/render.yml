name: High Quality 1-Minute Render (Variation 1)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render_var1:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        chunk: [7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev
      - run: pip install -r requirements.txt
      - run: |
          START_ANIM=$(( ${{ matrix.chunk }} * 2 ))
          END_ANIM=$(( START_ANIM + 1 ))
          CHUNK_ID=$(printf '%02d' ${{ matrix.chunk }})
          manim -qh -n $START_ANIM,$END_ANIM main.py Var1Kinetic --format mp4 -o chunk_${CHUNK_ID}.mp4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: var1_chunk_${{ matrix.chunk }}
          path: media/videos/**/chunk_*.mp4
          if-no-files-found: ignore
